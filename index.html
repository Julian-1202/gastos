<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gastos — Flucy y Neitor</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root {
  --bg: #f5f5f3;
  --surface: #ffffff;
  --surface2: #f5f5f3;
  --border: #e0e0dc;
  --border2: #ececea;
  --text: #1a1a1a;
  --text2: #666;
  --text3: #aaa;
  --btn-bg: #ffffff;
  --btn-hover: #f0f0ee;
  --input-bg: #ffffff;
  --primary-bg: #e6f1fb;
  --primary-border: #b5d4f4;
  --primary-text: #185fa5;
  --overlay: rgba(0,0,0,0.4);
  --shadow: 0 1px 4px rgba(0,0,0,0.06);
  --balance-ok-bg: #EAF3DE;
  --balance-ok-border: #C0DD97;
  --balance-warn-bg: #FAEEDA;
  --balance-warn-border: #FAC775;
  --saldado-bg: #EAF3DE;
  --saldado-border: #C0DD97;
  --saldado-text: #3B6D11;
}
[data-theme="dark"] {
  --bg: #111110;
  --surface: #1c1c1b;
  --surface2: #252524;
  --border: #2e2e2c;
  --border2: #333331;
  --text: #e8e8e5;
  --text2: #999;
  --text3: #555;
  --btn-bg: #1c1c1b;
  --btn-hover: #2a2a28;
  --input-bg: #1c1c1b;
  --primary-bg: #1a2e44;
  --primary-border: #2a4d72;
  --primary-text: #7ab8f5;
  --overlay: rgba(0,0,0,0.65);
  --shadow: 0 1px 4px rgba(0,0,0,0.3);
  --balance-ok-bg: #1a2e14;
  --balance-ok-border: #2d5020;
  --balance-warn-bg: #2e2210;
  --balance-warn-border: #5a3e10;
  --saldado-bg: #1a2e14;
  --saldado-border: #2d5020;
  --saldado-text: #7ec84a;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:1rem;transition:background .2s,color .2s}
.app{max-width:620px;margin:0 auto}
.topbar{display:flex;align-items:center;gap:8px;margin-bottom:1rem}
.topbar h1{font-size:17px;font-weight:500;flex:1}
.sync-info{font-size:11px;color:var(--text2);display:flex;align-items:center;gap:5px}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;flex-shrink:0}
.dot-ok{background:#639922}.dot-loading{background:#BA7517}.dot-error{background:#E24B4A}
.card{background:var(--surface);border:0.5px solid var(--border);border-radius:12px;padding:1rem 1.25rem;margin-bottom:1rem;box-shadow:var(--shadow)}
.btn{cursor:pointer;font-size:13px;padding:6px 14px;border-radius:8px;border:0.5px solid var(--border);background:var(--btn-bg);color:var(--text);font-family:inherit;transition:background .15s}
.btn:hover{background:var(--btn-hover)}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--primary-bg);border-color:var(--primary-border);color:var(--primary-text)}
.btn-sm{padding:3px 9px;font-size:11px}
.btn-danger{border-color:#f7c1c1;color:#a32d2d}
[data-theme="dark"] .btn-danger{border-color:#5a2020;color:#f08080}
.btn-full{width:100%}
.btn-icon{padding:5px 9px;font-size:15px;line-height:1}
input,select{font-size:13px;padding:7px 10px;border-radius:8px;border:0.5px solid var(--border);background:var(--input-bg);color:var(--text);width:100%;font-family:inherit;transition:border-color .15s}
input:focus,select:focus{outline:none;border-color:var(--primary-text)}
label.lbl{font-size:11px;color:var(--text2);display:block;margin-bottom:3px}
.row{display:flex;justify-content:space-between;align-items:flex-start;padding:10px 0;border-bottom:0.5px solid var(--border2);gap:8px}
.row:last-child{border-bottom:none}
.tabs{display:flex;gap:4px;margin-bottom:1rem}
.tab{cursor:pointer;font-size:13px;padding:7px 16px;border-radius:8px;border:0.5px solid transparent;color:var(--text2);transition:all .15s}
.tab.active{border-color:var(--border);color:var(--text);background:var(--surface)}
.pill{display:inline-block;font-size:10px;padding:2px 7px;border-radius:20px;font-weight:500;white-space:nowrap}
.pill-shared{background:#e6f1fb;color:#185fa5}
[data-theme="dark"] .pill-shared{background:#1a2e44;color:#7ab8f5}
.pill-flucy{background:#EEEDFE;color:#3C3489}
[data-theme="dark"] .pill-flucy{background:#1e1a40;color:#9b93f5}
.pill-neitor{background:#E1F5EE;color:#085041}
[data-theme="dark"] .pill-neitor{background:#0d2920;color:#4ec99a}
.pill-warn{background:#FAEEDA;color:#854F0B}
[data-theme="dark"] .pill-warn{background:#2e2210;color:#f5b84a}
.pill-ok{background:#EAF3DE;color:#3B6D11}
[data-theme="dark"] .pill-ok{background:#1a2e14;color:#7ec84a}
.g-title{font-size:13px;font-weight:500;display:flex;align-items:center;flex-wrap:wrap;gap:4px}
.g-sub{font-size:11px;color:var(--text2);margin-top:3px;display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.g-cuota{font-size:11px;color:var(--text3);margin-top:2px}
.metric{background:var(--surface2);border-radius:8px;padding:12px}
.metric p:first-child{font-size:11px;color:var(--text2);margin-bottom:3px}
.metric p:last-child{font-size:19px;font-weight:500}
.catdot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;flex-shrink:0}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.section-title{font-size:11px;font-weight:500;color:var(--text2);text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px}
.legend-item{display:flex;align-items:center;gap:8px;font-size:12px;padding:4px 0}
.overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:var(--overlay);display:flex;align-items:center;justify-content:center;z-index:100;padding:1rem}
.modal{background:var(--surface);border-radius:12px;padding:1.25rem;width:100%;max-width:460px;max-height:90vh;overflow-y:auto;border:0.5px solid var(--border)}
.modal-title{font-size:15px;font-weight:500;margin-bottom:1rem}
.amounts{display:flex;align-items:center;gap:6px;flex-shrink:0}
.amount-main{font-size:15px;font-weight:500}
.balance-card{border-radius:12px;padding:1rem 1.25rem;margin-bottom:1rem}
.balance-ok{background:var(--balance-ok-bg);border:1.5px solid var(--balance-ok-border)}
.balance-warn{background:var(--balance-warn-bg);border:1.5px solid var(--balance-warn-border)}
.balance-text{font-size:17px;font-weight:500}
.balance-sub{font-size:12px;color:var(--text2);margin-top:4px}
.charts-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1rem}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:1rem}
.filters select{width:auto;font-size:12px;padding:5px 8px}
.filters input{width:auto;font-size:12px;padding:5px 8px;flex:1;min-width:120px}
.empty{font-size:13px;color:var(--text3);text-align:center;padding:2rem 0}
.toggle-dark{background:none;border:0.5px solid var(--border);border-radius:8px;padding:5px 9px;cursor:pointer;font-size:15px;color:var(--text);transition:background .15s}
.toggle-dark:hover{background:var(--btn-hover)}
.saldado-banner{background:var(--saldado-bg);border:1px solid var(--saldado-border);border-radius:10px;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;gap:8px}
.saldado-banner p{font-size:13px;color:var(--saldado-text);font-weight:500}
.saldado-banner small{font-size:11px;color:var(--text2);display:block;font-weight:400}
.chip-active{background:var(--primary-bg);border-color:var(--primary-border);color:var(--primary-text)}
.view-toggle{display:flex;gap:4px;margin-bottom:1rem}
.view-toggle button{flex:1;font-size:12px;padding:5px 0;border-radius:8px;border:0.5px solid var(--border);background:var(--btn-bg);color:var(--text2);cursor:pointer;transition:all .15s;font-family:inherit}
.view-toggle button.active{background:var(--surface);border-color:var(--border);color:var(--text);font-weight:500}
.kanban-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:1rem}
.kanban-col{background:var(--surface2);border-radius:10px;padding:10px}
.kanban-col-header{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.kanban-col-title{font-size:12px;font-weight:500}
.kanban-col-total{font-size:11px;color:var(--text2);margin-left:auto}
.kanban-card{background:var(--surface);border:0.5px solid var(--border);border-radius:8px;padding:8px 10px;margin-bottom:6px;cursor:pointer;transition:box-shadow .15s}
.kanban-card:last-child{margin-bottom:0}
.kanban-card:hover{box-shadow:0 2px 8px rgba(0,0,0,0.12)}
.kanban-card-title{font-size:12px;font-weight:500;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kanban-card-amount{font-size:15px;font-weight:600;margin-bottom:4px}
.kanban-card-meta{display:flex;flex-wrap:wrap;gap:3px}
@media(max-width:480px){.charts-grid{grid-template-columns:1fr}.g3{grid-template-columns:1fr 1fr}.filters{gap:4px}.kanban-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <h1>💸 Flucy y Neitor</h1>
    <div class="sync-info" id="sync-bar"><span class="dot dot-loading"></span> Cargando...</div>
    <button class="toggle-dark" onclick="toggleDark()" id="dark-btn" title="Modo oscuro">🌙</button>
  </div>

  <div class="tabs">
    <div class="tab active" onclick="setTab('historial')">Historial</div>
    <div class="tab" onclick="setTab('resumen')">Resumen</div>
    <div class="tab" onclick="setTab('anual')">Anual</div>
  </div>

  <div id="view-historial"></div>
  <div id="view-resumen" style="display:none"></div>
  <div id="view-anual" style="display:none"></div>
  <div id="modal-container"></div>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzorSADHLjeK-vGZsxeUMVnbMzuE5o-QuXGQI1H8jMAQRV75i9TZLZSfJGUES_dtAVlOA/exec";

const CATS = [
  {id:'super',label:'Supermercado',color:'#1D9E75'},
  {id:'salidas',label:'Salidas',color:'#7F77DD'},
  {id:'servicios',label:'Servicios',color:'#378ADD'},
  {id:'ropa',label:'Ropa',color:'#D4537E'},
  {id:'transporte',label:'Transporte',color:'#BA7517'},
  {id:'salud',label:'Salud',color:'#E24B4A'},
  {id:'otro',label:'Otro',color:'#888780'},
];
const catMap = {};
CATS.forEach(c => catMap[c.id] = c);

const HEADERS_GASTOS = ['id','fecha','desc','cat','tipo','pagador','beneficiario','monto','frecuencia','cuotas','notas'];
const HEADERS_SALDADOS = ['mes','fecha','monto','quien','nota'];

let charts = {};
let state = {
  tab: 'historial',
  gastos: [],
  saldados: [],
  nextId: 1,
  modal: null,
  editando: false,
  modalSaldado: false,
  filtroMes: new Date().toISOString().slice(0,7),
  filtroAnio: new Date().getFullYear(),
  filtroCat: 'todas',
  filtroPagador: 'todos',
  filtroBusqueda: '',
  vistaHistorial: 'lista', // 'lista' | 'kanban'
  syncStatus: 'loading',
  syncMsg: 'Cargando...',
};

// --- DARK MODE ---
function initTheme() {
  const saved = localStorage.getItem('theme') || 'light';
  document.documentElement.setAttribute('data-theme', saved);
  updateDarkBtn(saved);
}
function toggleDark() {
  const current = document.documentElement.getAttribute('data-theme');
  const next = current === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('theme', next);
  updateDarkBtn(next);
}
function updateDarkBtn(theme) {
  const btn = document.getElementById('dark-btn');
  if (btn) btn.textContent = theme === 'dark' ? '☀️' : '🌙';
}

// --- SHEETS ---
function rowToGasto(row) {
  if (!row || row.length < 11) return null;
  return {
    id: parseInt(row[0]),
    fecha: row[1]||'',
    desc: row[2]||'',
    cat: row[3]||'otro',
    tipo: row[4]||'compartido',
    pagador: row[5]||'Flucy',
    beneficiario: row[6]||null,
    monto: parseFloat(row[7])||0,
    frecuencia: row[8]||'unica',
    cuotas: row[9] ? parseInt(row[9]) : null,
    notas: row[10]||'',
  };
}
function gastoToRow(g) {
  return [g.id,g.fecha,g.desc,g.cat,g.tipo,g.pagador,g.beneficiario||'',g.monto,g.frecuencia,g.cuotas||'',g.notas||''];
}
function rowToSaldado(row) {
  if (!row || row.length < 4) return null;
  return { mes:row[0], fecha:row[1], monto:parseFloat(row[2])||0, quien:row[3], nota:row[4]||'' };
}
function saldadoToRow(s) {
  return [s.mes, s.fecha, s.monto, s.quien, s.nota||''];
}

async function sheetRead() {
  const res = await fetch(SCRIPT_URL + "?action=read");
  const data = await res.json();
  if (!Array.isArray(data)) return { gastos:[], saldados:[] };

  // Sheet "Gastos" data
  const gastos = data.gastos
    ? data.gastos.slice(1).map(rowToGasto).filter(Boolean)
    : data.slice ? data.slice(1).map(rowToGasto).filter(Boolean) : [];

  const saldados = data.saldados
    ? data.saldados.slice(1).map(rowToSaldado).filter(Boolean)
    : [];

  return { gastos, saldados };
}

async function sheetWrite() {
  const gastosRows = [HEADERS_GASTOS, ...state.gastos.map(gastoToRow)];
  const saldadosRows = [HEADERS_SALDADOS, ...state.saldados.map(saldadoToRow)];
  await fetch(SCRIPT_URL, {
    method: 'POST',
    body: JSON.stringify({ action:'write', rows: gastosRows, saldadosRows }),
  });
}

async function loadData() {
  setSyncStatus('loading','Sincronizando...');
  try {
    const { gastos, saldados } = await sheetRead();
    state.gastos = gastos;
    state.saldados = saldados;
    state.nextId = gastos.length > 0 ? Math.max(...gastos.map(g=>g.id))+1 : 1;
    setSyncStatus('ok','Sincronizado ✓');
  } catch(e) {
    // fallback: try old format
    try {
      const res = await fetch(SCRIPT_URL + "?action=read");
      const data = await res.json();
      if (Array.isArray(data) && data.length > 1) {
        state.gastos = data.slice(1).map(rowToGasto).filter(Boolean);
        state.nextId = state.gastos.length > 0 ? Math.max(...state.gastos.map(g=>g.id))+1 : 1;
      }
      setSyncStatus('ok','Sincronizado ✓');
    } catch(e2) {
      setSyncStatus('error','Error de conexión');
    }
  }
  render();
}

async function saveData() {
  setSyncStatus('loading','Guardando...');
  renderSyncBar();
  try {
    await sheetWrite();
    setSyncStatus('ok','Guardado ✓');
  } catch(e) {
    setSyncStatus('error','Error al guardar');
  }
  renderSyncBar();
}

function setSyncStatus(s, msg) { state.syncStatus=s; state.syncMsg=msg; }
function renderSyncBar() {
  const cls = state.syncStatus==='ok'?'dot-ok':state.syncStatus==='loading'?'dot-loading':'dot-error';
  const el = document.getElementById('sync-bar');
  if (el) el.innerHTML = `<span class="dot ${cls}"></span> ${state.syncMsg} <button class="btn btn-sm" onclick="loadData()" style="margin-left:4px">↻</button>`;
}

// --- HELPERS ---
function fmt(n) { return '$'+Math.round(n).toLocaleString('es-AR'); }
function hoy() { return new Date().toISOString().slice(0,10); }
function escHtml(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function gastosMes(mes) {
  return state.gastos.filter(g => {
    if (g.frecuencia==='mensual') return true;
    if (g.frecuencia==='cuotas') {
      const [gy,gm]=g.fecha.slice(0,7).split('-').map(Number);
      const [fy,fm]=mes.split('-').map(Number);
      const diff=(fy-gy)*12+(fm-gm);
      return diff>=0 && diff<g.cuotas;
    }
    return g.fecha.slice(0,7)===mes;
  });
}
function montoMensual(g) { return g.frecuencia==='cuotas' ? g.monto/g.cuotas : g.monto; }
function cuotasRestantes(g) {
  if (g.frecuencia!=='cuotas' || !g.cuotas) return null;
  const [gy,gm]=g.fecha.slice(0,7).split('-').map(Number);
  const now=new Date();
  return Math.max(0, g.cuotas - ((now.getFullYear()-gy)*12+(now.getMonth()+1-gm)));
}
function calcBalance(mes) {
  const gs=gastosMes(mes);
  let fG=0,nG=0,fP=0,nP=0;
  gs.forEach(g=>{
    const m=montoMensual(g);
    if(g.tipo==='compartido'){fG+=m/2;nG+=m/2;if(g.pagador==='Flucy')fP+=m;else nP+=m;}
    else{if(g.beneficiario==='Flucy'){fG+=m;fP+=m;}else{nG+=m;nP+=m;}}
  });
  return{flucyGasta:fG,neitorGasta:nG,flucyPaga:fP,neitorPaga:nP,flucyBalance:fP-fG,neitorBalance:nP-nG};
}
function getSaldadoMes(mes) {
  return state.saldados.find(s=>s.mes===mes)||null;
}

// --- TABS ---
function setTab(t) {
  state.tab=t;
  document.querySelectorAll('.tab').forEach((el,i)=>el.classList.toggle('active',['historial','resumen','anual'][i]===t));
  document.getElementById('view-historial').style.display=t==='historial'?'':'none';
  document.getElementById('view-resumen').style.display=t==='resumen'?'':'none';
  document.getElementById('view-anual').style.display=t==='anual'?'':'none';
  render();
}

function render() {
  destroyCharts();
  renderSyncBar();
  if (state.tab==='historial') renderHistorial();
  else if (state.tab==='resumen') renderResumen();
  else if (state.tab==='anual') renderAnual();
  renderModal();
}

// --- HISTORIAL ---
function renderHistorial() {
  // Build months list for filter
  const mesesSet = new Set();
  state.gastos.forEach(g => mesesSet.add(g.fecha.slice(0,7)));
  for(let i=-1;i<=0;i++){const d=new Date();d.setMonth(d.getMonth()+i);mesesSet.add(d.toISOString().slice(0,7));}
  const mesesList = [...mesesSet].sort().reverse();

  const fMes = state.filtroMes;
  const fCat = state.filtroCat;
  const fPag = state.filtroPagador;
  const fBus = state.filtroBusqueda.toLowerCase();

  let gs = state.gastos.filter(g => {
    // mes filter: check if gasto applies to that month
    let enMes;
    if (g.frecuencia==='mensual') enMes=true;
    else if(g.frecuencia==='cuotas'){
      const [gy,gm]=g.fecha.slice(0,7).split('-').map(Number);
      const [fy,fm]=fMes.split('-').map(Number);
      const diff=(fy-gy)*12+(fm-gm);
      enMes=diff>=0&&diff<g.cuotas;
    } else enMes=g.fecha.slice(0,7)===fMes;
    if(!enMes) return false;
    if(fCat!=='todas'&&g.cat!==fCat) return false;
    if(fPag!=='todos'&&g.pagador!==fPag) return false;
    if(fBus&&!g.desc.toLowerCase().includes(fBus)) return false;
    return true;
  }).sort((a,b)=>b.fecha.localeCompare(a.fecha));

  const mOpts = mesesList.map(m=>`<option value="${m}" ${m===fMes?'selected':''}>${m}</option>`).join('');
  const catOpts = `<option value="todas">Todas las categorías</option>`+CATS.map(c=>`<option value="${c.id}" ${c.id===fCat?'selected':''}>${c.label}</option>`).join('');
  const pagOpts = `<option value="todos">Cualquiera</option><option value="Flucy" ${fPag==='Flucy'?'selected':''}>Pagó Flucy</option><option value="Neitor" ${fPag==='Neitor'?'selected':''}>Pagó Neitor</option>`;

  // Saldado banner
  const saldado = getSaldadoMes(fMes);
  const bal = calcBalance(fMes);
  let saldadoBanner = '';
  if (saldado) {
    saldadoBanner = `<div class="saldado-banner">
      <div>
        <p>✅ Mes saldado</p>
        <small>${saldado.quien} pasó ${fmt(saldado.monto)} el ${saldado.fecha}${saldado.nota?' · '+escHtml(saldado.nota):''}</small>
      </div>
      <button class="btn btn-sm btn-danger" onclick="borrarSaldado('${fMes}')">✕ Quitar</button>
    </div>`;
  } else if (Math.abs(bal.flucyBalance)>0.5 || Math.abs(bal.neitorBalance)>0.5) {
    const quien = bal.flucyBalance < -0.5 ? 'Flucy' : 'Neitor';
    const monto = Math.abs(bal.flucyBalance < -0.5 ? bal.flucyBalance : bal.neitorBalance);
    saldadoBanner = `<div class="balance-card balance-warn" style="display:flex;align-items:center;justify-content:space-between;gap:8px;padding:.8rem 1rem;margin-bottom:.75rem">
      <div>
        <div style="font-size:13px;font-weight:500">${quien} le debe ${fmt(monto)}</div>
        <div style="font-size:11px;color:var(--text2);margin-top:2px">¿Ya lo saldaron este mes?</div>
      </div>
      <button class="btn btn-sm btn-primary" onclick="abrirModalSaldado('${quien}',${monto})">Marcar saldado</button>
    </div>`;
  }

  const rows = gs.map(g => {
    const cat = catMap[g.cat]||catMap['otro'];

    if(g.frecuencia==='mensual') frecTag=`<span class="pill pill-ok" style="margin-left:2px">mensual</span>`;
    if(g.frecuencia==='cuotas') frecTag=`<span class="pill pill-warn" style="margin-left:2px">${cuotasR} cuotas</span>`;
    const tipoTag=g.tipo==='compartido'
      ?`<span class="pill pill-shared">compartido</span>`
      :`<span class="pill ${g.beneficiario==='Flucy'?'pill-flucy':'pill-neitor'}">${escHtml(g.beneficiario)}</span>`;
    const pagTag=`<span class="pill ${g.pagador==='Flucy'?'pill-flucy':'pill-neitor'}">pagó ${g.pagador}</span>`;

      <div style="flex:1;min-width:0">
        <div class="g-title"><span class="catdot" style="background:${cat.color}"></span>${escHtml(g.desc)}${frecTag}</div>
        <div class="g-sub">${tipoTag}${pagTag}<span>${g.fecha}</span>${g.notas?`<span>· ${escHtml(g.notas)}</span>`:''}</div>
        ${g.frecuencia==='cuotas' && cuotasR!==null ?`<div class="g-cuota">cuota: ${fmt(m)} · total: ${fmt(g.monto)} · ${cuotasR} restantes</div>`:''}
      </div>
      <div class="amounts">
        <span class="amount-main">${fmt(g.frecuencia==='cuotas'?m:g.monto)}</span>

  const resumenFiltro = gs.length>0 ? `<div style="font-size:12px;color:var(--text2);margin-top:10px;padding-top:10px;border-top:0.5px solid var(--border2);display:flex;justify-content:space-between"><span>${gs.length} gasto${gs.length!==1?'s':''}</span><span style="font-weight:500">${fmt(totalFiltrado)}</span></div>` : '';

}

function setVista(v) { state.vistaHistorial=v; renderHistorial(); }

function buildKanban(gs) {
  // Group by category, only cats with gastos
  const grupos = CATS.map(cat => {
    const items = gs.filter(g => g.cat === cat.id);
    return { cat, items, total: items.reduce((s,g)=>s+montoMensual(g),0) };
  }).filter(g => g.items.length > 0);

  if (!grupos.length) return `<div class="empty">Sin gastos para este filtro</div>`;

  const cols = grupos.map(({cat, items, total}) => {
    const cards = items.map(g => {
      const m = montoMensual(g);
      const cuotasR = cuotasRestantes(g);
      let frecTag='';
      if(g.frecuencia==='mensual') frecTag=`<span class="pill pill-ok">mensual</span>`;
      if(g.frecuencia==='cuotas') frecTag=`<span class="pill pill-warn">${cuotasR}c</span>`;
      const tipoTag = g.tipo==='compartido'
        ? `<span class="pill pill-shared">50/50</span>`
        : `<span class="pill ${g.beneficiario==='Flucy'?'pill-flucy':'pill-neitor'}">${escHtml(g.beneficiario)}</span>`;
      const pagTag = `<span class="pill ${g.pagador==='Flucy'?'pill-flucy':'pill-neitor'}">${g.pagador}</span>`;
      return `<div class="kanban-card" onclick="abrirEditar(${g.id})">
        <div class="kanban-card-title">${escHtml(g.desc)}</div>
        <div class="kanban-card-amount">${fmt(g.frecuencia==='cuotas'?m:g.monto)}</div>
        <div class="kanban-card-meta">${tipoTag}${pagTag}${frecTag}</div>
        ${g.frecuencia==='cuotas'&&cuotasR!==null?`<div style="font-size:10px;color:var(--text3);margin-top:3px">${cuotasR} cuotas restantes</div>`:''}
      </div>`;
    }).join('');

    return `<div class="kanban-col">
      <div class="kanban-col-header">
        <span style="width:9px;height:9px;border-radius:50%;background:${cat.color};display:inline-block;flex-shrink:0"></span>
        <span class="kanban-col-title">${cat.label}</span>
        <span class="kanban-col-total">${fmt(total)}</span>
      </div>
      ${cards}
    </div>`;
  }).join('');

  const totalAll = grupos.reduce((s,g)=>s+g.total,0);
  return `<div class="kanban-grid">${cols}</div>
    <div style="font-size:12px;color:var(--text2);text-align:right;margin-bottom:1rem">
      ${grupos.reduce((s,g)=>s+g.items.length,0)} gastos · <strong>${fmt(totalAll)}</strong>
    </div>`;
}
  if(tipo==='mes') state.filtroMes=val;
  else if(tipo==='cat') state.filtroCat=val;
  else if(tipo==='pag') state.filtroPagador=val;
  else if(tipo==='bus'){ state.filtroBusqueda=val; renderGastosLista(); return; }
  renderHistorial();
}

function renderGastosLista() {
  // Only re-renders the gastos list and summary, not the filters (so search input keeps focus)
  const fMes=state.filtroMes, fCat=state.filtroCat, fPag=state.filtroPagador;
  const fBus=state.filtroBusqueda.toLowerCase();
  const gs = state.gastos.filter(g=>{
    let enMes;
    if(g.frecuencia==='mensual') enMes=true;
    else if(g.frecuencia==='cuotas'){
      const [gy,gm]=g.fecha.slice(0,7).split('-').map(Number);
      const [fy,fm]=fMes.split('-').map(Number);
      const diff=(fy-gy)*12+(fm-gm);
      enMes=diff>=0&&diff<g.cuotas;
    } else enMes=g.fecha.slice(0,7)===fMes;
    if(!enMes) return false;
    if(fCat!=='todas'&&g.cat!==fCat) return false;
    if(fPag!=='todos'&&g.pagador!==fPag) return false;
    if(fBus&&!g.desc.toLowerCase().includes(fBus)) return false;
    return true;
  }).sort((a,b)=>b.fecha.localeCompare(a.fecha));

  const rows = gs.map(g => {
    const cat=catMap[g.cat]||catMap['otro'];
    const cuotasR=cuotasRestantes(g);
    const m=montoMensual(g);
    let frecTag='';
    if(g.frecuencia==='mensual') frecTag=`<span class="pill pill-ok" style="margin-left:2px">mensual</span>`;
    if(g.frecuencia==='cuotas') frecTag=`<span class="pill pill-warn" style="margin-left:2px">${cuotasR} cuotas</span>`;
    const tipoTag=g.tipo==='compartido'
      ?`<span class="pill pill-shared">compartido</span>`
      :`<span class="pill ${g.beneficiario==='Flucy'?'pill-flucy':'pill-neitor'}">${escHtml(g.beneficiario)}</span>`;
    const pagTag=`<span class="pill ${g.pagador==='Flucy'?'pill-flucy':'pill-neitor'}">pagó ${g.pagador}</span>`;
    return `<div class="row">
      <div style="flex:1;min-width:0">
        <div class="g-title"><span class="catdot" style="background:${cat.color}"></span>${escHtml(g.desc)}${frecTag}</div>
        <div class="g-sub">${tipoTag}${pagTag}<span>${g.fecha}</span>${g.notas?`<span>· ${escHtml(g.notas)}</span>`:''}</div>
        ${g.frecuencia==='cuotas'&&cuotasR!==null?`<div class="g-cuota">cuota: ${fmt(m)} · total: ${fmt(g.monto)} · ${cuotasR} restantes</div>`:''}
      </div>
      <div class="amounts">
        <span class="amount-main">${fmt(g.frecuencia==='cuotas'?m:g.monto)}</span>
        <button class="btn btn-sm btn-icon" onclick="abrirEditar(${g.id})">✏️</button>
        <button class="btn btn-sm btn-danger" onclick="borrar(${g.id})">✕</button>
      </div>
    </div>`;
  }).join('')||`<div class="empty">Sin gastos para este filtro</div>`;

  const totalFiltrado=gs.reduce((s,g)=>s+montoMensual(g),0);
  const resumenFiltro=gs.length>0?`<div style="font-size:12px;color:var(--text2);margin-top:10px;padding-top:10px;border-top:0.5px solid var(--border2);display:flex;justify-content:space-between"><span>${gs.length} gasto${gs.length!==1?'s':''}</span><span style="font-weight:500">${fmt(totalFiltrado)}</span></div>`:'';

  const listContainer=document.getElementById('gastos-lista');
  if(listContainer) listContainer.innerHTML=rows+resumenFiltro;
}

function abrirModalSaldado(quien, monto) {
  state.modalSaldado = { mes: state.filtroMes, quien, monto };
  renderModal();
}
async function borrarSaldado(mes) {
  state.saldados = state.saldados.filter(s=>s.mes!==mes);
  render();
  await saveData();
}
async function guardarSaldado() {
  const quien = document.getElementById('s-quien')?.value || state.modalSaldado.quien;
  const monto = parseFloat(document.getElementById('s-monto')?.value)||0;
  const nota = document.getElementById('s-nota')?.value||'';
  const mes = state.modalSaldado.mes;
  state.saldados = state.saldados.filter(s=>s.mes!==mes);
  state.saldados.push({ mes, fecha: hoy(), monto, quien, nota });
  state.modalSaldado = false;
  render();
  await saveData();
}

// --- ANUAL ---
function gastosAnio(anio) {
  // For each month of the year, get the gastos that apply
  const result = [];
  for (let m=1; m<=12; m++) {
    const mes = `${anio}-${String(m).padStart(2,'0')}`;
    const gs = gastosMes(mes);
    gs.forEach(g => {
      if (!result.find(x=>x.id===g.id && x._mes===mes)) {
        result.push({...g, _mes: mes, _montoMes: montoMensual(g)});
      }
    });
  }
  return result;
}

function renderAnual() {
  const anio = state.filtroAnio;
  const now = new Date();

  // Collect available years from gastos
  const aniosSet = new Set([now.getFullYear(), now.getFullYear()-1]);
  state.gastos.forEach(g => aniosSet.add(parseInt(g.fecha.slice(0,4))));
  const aniosList = [...aniosSet].sort().reverse();
  const anioOpts = aniosList.map(a=>`<option value="${a}" ${a===anio?'selected':''}>${a}</option>`).join('');

  // Build monthly totals for line chart
  const meses = [];
  const totalPorMes = [];
  const flucyPorMes = [];
  const neitorPorMes = [];

  for (let m=1; m<=12; m++) {
    const mes = `${anio}-${String(m).padStart(2,'0')}`;
    // Skip future months
    if (mes > now.toISOString().slice(0,7)) break;
    meses.push(mes.slice(5)); // "01", "02"...
    const gs = gastosMes(mes);
    let total=0, flucy=0, neitor=0;
    gs.forEach(g=>{
      const mm = montoMensual(g);
      total += mm;
      if(g.tipo==='compartido'){ flucy+=mm/2; neitor+=mm/2; }
      else if(g.beneficiario==='Flucy') flucy+=mm;
      else neitor+=mm;
    });
    totalPorMes.push(Math.round(total));
    flucyPorMes.push(Math.round(flucy));
    neitorPorMes.push(Math.round(neitor));
  }

  // Annual totals
  const totalAnio = totalPorMes.reduce((s,v)=>s+v,0);
  const flucyAnio = flucyPorMes.reduce((s,v)=>s+v,0);
  const neitorAnio = neitorPorMes.reduce((s,v)=>s+v,0);
  const promMensual = meses.length ? Math.round(totalAnio/meses.length) : 0;

  // Category breakdown for the year
  const catAnio = CATS.map(c=>{
    let tot=0;
    for(let m=1;m<=12;m++){
      const mes=`${anio}-${String(m).padStart(2,'0')}`;
      if(mes>now.toISOString().slice(0,7)) break;
      gastosMes(mes).filter(g=>g.cat===c.id).forEach(g=>tot+=montoMensual(g));
    }
    return {...c,total:Math.round(tot)};
  }).filter(c=>c.total>0).sort((a,b)=>b.total-a.total);

  const catRows = catAnio.map(c=>`
    <div class="legend-item">
      <span style="width:10px;height:10px;border-radius:50%;background:${c.color};display:inline-block;flex-shrink:0"></span>
      <span style="flex:1">${c.label}</span>
      <span style="font-weight:500">${fmt(c.total)}</span>
      <span style="color:var(--text3);font-size:11px">${totalAnio>0?Math.round(c.total/totalAnio*100):0}%</span>
    </div>`).join('') || '<p style="font-size:12px;color:var(--text3)">Sin datos</p>';

  const mesLabels = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];

  document.getElementById('view-anual').innerHTML = `
    <div style="margin-bottom:1rem;display:flex;align-items:center;gap:8px">
      <div style="flex:1"><label class="lbl">Año</label>
        <select onchange="setAnio(this.value)" style="max-width:120px">${anioOpts}</select>
      </div>
    </div>
    <div class="g3" style="margin-bottom:1rem">
      <div class="metric"><p>Total ${anio}</p><p>${fmt(totalAnio)}</p></div>
      <div class="metric"><p>Flucy gastó</p><p style="color:#7F77DD">${fmt(flucyAnio)}</p></div>
      <div class="metric"><p>Neitor gastó</p><p style="color:#1D9E75">${fmt(neitorAnio)}</p></div>
    </div>
    <div class="g2" style="margin-bottom:1rem">
      <div class="metric"><p>Promedio mensual</p><p>${fmt(promMensual)}</p></div>
      <div class="metric"><p>Meses registrados</p><p>${meses.length}</p></div>
    </div>
    <div class="card" style="margin-bottom:1rem">
      <p class="section-title">Evolución mensual</p>
      <canvas id="chart-linea" height="160"></canvas>
      <div style="display:flex;gap:16px;margin-top:10px;flex-wrap:wrap">
        <div class="legend-item"><span style="width:10px;height:3px;background:#7F77DD;display:inline-block;border-radius:2px"></span><span>Flucy</span></div>
        <div class="legend-item"><span style="width:10px;height:3px;background:#1D9E75;display:inline-block;border-radius:2px"></span><span>Neitor</span></div>
        <div class="legend-item"><span style="width:10px;height:3px;background:#378ADD;display:inline-block;border-radius:2px;border-top:2px dashed #378ADD"></span><span>Total</span></div>
      </div>
    </div>
    <div class="card">
      <p class="section-title">Por categoría — año completo</p>
      ${catRows}
    </div>`;

  setTimeout(()=>{
    const ctx = document.getElementById('chart-linea');
    if (!ctx || !meses.length) return;
    const labels = meses.map(m => mesLabels[parseInt(m)-1]);
    charts.linea = new Chart(ctx, {
      type: 'line',
      data: {
        labels,
        datasets: [
          { label:'Flucy', data:flucyPorMes, borderColor:'#7F77DD', backgroundColor:'rgba(127,119,221,0.08)', tension:0.35, pointRadius:3, pointHoverRadius:5, fill:false },
          { label:'Neitor', data:neitorPorMes, borderColor:'#1D9E75', backgroundColor:'rgba(29,158,117,0.08)', tension:0.35, pointRadius:3, pointHoverRadius:5, fill:false },
          { label:'Total', data:totalPorMes, borderColor:'#378ADD', backgroundColor:'rgba(55,138,221,0.05)', tension:0.35, pointRadius:3, pointHoverRadius:5, fill:false, borderDash:[5,4] },
        ]
      },
      options: {
        responsive:true,
        plugins:{
          legend:{display:false},
          tooltip:{callbacks:{label:ctx=>` ${ctx.dataset.label}: ${fmt(ctx.raw)}`}}
        },
        scales:{
          y:{ticks:{callback:v=>fmt(v)},grid:{color:'rgba(128,128,128,0.1)'}},
          x:{grid:{display:false}}
        }
      }
    });
  },50);
}

}
function abrirEditar(id){
  const g=state.gastos.find(x=>x.id===id);
  if(!g) return;
  state.modal={...g}; state.editando=true; renderModal();
}
function cerrarModal(){state.modal=null;state.editando=false;state.modalSaldado=false;renderModal();}

function renderModal(){
  const container=document.getElementById('modal-container');
  if(!container) return;

  // Modal saldado
  if(state.modalSaldado){
    const s=state.modalSaldado;
    container.innerHTML=`
    <div class="overlay" onclick="if(event.target===this)cerrarModal()">
      <div class="modal">
        <div class="modal-title">Marcar mes saldado</div>
        <p style="font-size:13px;color:var(--text2);margin-bottom:1rem">Registrá el pago que equilibra las cuentas de <strong>${s.mes}</strong>.</p>
        <div class="g2" style="margin-bottom:8px">
          <div><label class="lbl">Quién pagó</label>
            <select id="s-quien">
              <option value="Flucy" ${s.quien==='Flucy'?'selected':''}>Flucy</option>
              <option value="Neitor" ${s.quien==='Neitor'?'selected':''}>Neitor</option>
            </select>
          </div>
          <div><label class="lbl">Monto ($)</label><input id="s-monto" type="number" value="${Math.round(s.monto)}" min="0" step="1"></div>
        </div>
        <div style="margin-bottom:1rem"><label class="lbl">Nota (opcional)</label><input id="s-nota" placeholder="Ej: transferencia Mercado Pago"></div>
        <div style="display:flex;gap:8px;justify-content:flex-end">
          <button class="btn" onclick="cerrarModal()">Cancelar</button>
          <button class="btn btn-primary" onclick="guardarSaldado()">Confirmar</button>
        </div>
      </div>
    </div>`;
    return;
  }

  if(!state.modal){container.innerHTML='';return;}
  const g=state.modal;
  const esCuotas=g.frecuencia==='cuotas';
  const esComp=g.tipo==='compartido';
  const catOpts=CATS.map(c=>`<option value="${c.id}" ${c.id===g.cat?'selected':''}>${c.label}</option>`).join('');
  container.innerHTML=`
  <div class="overlay" onclick="if(event.target===this)cerrarModal()">
    <div class="modal">
      <div class="modal-title">${state.editando?'Editar gasto':'Nuevo gasto'}</div>
      <div style="margin-bottom:8px"><label class="lbl">Descripción</label><input id="m-desc" value="${escHtml(g.desc)}" placeholder="Ej: Supermercado"></div>
      <div class="g2" style="margin-bottom:8px">
        <div><label class="lbl">Monto total ($)</label><input id="m-monto" type="number" value="${g.monto||''}" min="0" step="1"></div>
        <div><label class="lbl">Fecha</label><input id="m-fecha" type="date" value="${g.fecha}"></div>
      </div>
      <div class="g2" style="margin-bottom:8px">
        <div><label class="lbl">Categoría</label><select id="m-cat">${catOpts}</select></div>
        <div><label class="lbl">Pagó</label><select id="m-pagador"><option value="Flucy" ${g.pagador==='Flucy'?'selected':''}>Flucy</option><option value="Neitor" ${g.pagador==='Neitor'?'selected':''}>Neitor</option></select></div>
      </div>
      <div class="g2" style="margin-bottom:8px">
        <div><label class="lbl">Tipo</label>
          <select id="m-tipo" onchange="onTipoChange(this.value)">
            <option value="compartido" ${g.tipo==='compartido'?'selected':''}>Compartido 50/50</option>
            <option value="individual" ${g.tipo==='individual'?'selected':''}>Individual</option>
          </select>
        </div>
        <div id="m-benef-wrap" style="${esComp?'opacity:.4;pointer-events:none':''}">
          <label class="lbl">Beneficiario</label>
          <select id="m-beneficiario"><option value="Flucy" ${g.beneficiario==='Flucy'?'selected':''}>Flucy</option><option value="Neitor" ${g.beneficiario==='Neitor'?'selected':''}>Neitor</option></select>
        </div>
      </div>
      <div style="margin-bottom:8px"><label class="lbl">Frecuencia</label>
        <select id="m-frec" onchange="onFrecChange(this.value)">
          <option value="unica" ${g.frecuencia==='unica'?'selected':''}>Única vez</option>
          <option value="mensual" ${g.frecuencia==='mensual'?'selected':''}>Mensual (recurrente)</option>
          <option value="cuotas" ${g.frecuencia==='cuotas'?'selected':''}>En cuotas</option>
        </select>
      </div>
      <div id="m-cuotas-wrap" style="${esCuotas?'':'display:none'}margin-bottom:8px">
        <label class="lbl">Cantidad de cuotas</label>
        <input id="m-cuotas" type="number" min="2" max="120" value="${g.cuotas||12}" oninput="updateCuotaPreview()">
        <p id="m-cuota-preview" style="font-size:12px;color:var(--text2);margin-top:4px"></p>
      </div>
      <div style="margin-bottom:1rem"><label class="lbl">Notas (opcional)</label><input id="m-notas" value="${escHtml(g.notas||'')}" placeholder="Aclaración adicional"></div>
      <div style="display:flex;gap:8px;justify-content:flex-end">
        <button class="btn" onclick="cerrarModal()">Cancelar</button>
        <button class="btn btn-primary" onclick="guardarGasto()">Guardar</button>
      </div>
    </div>
  </div>`;
  updateCuotaPreview();
  document.getElementById('m-monto')?.addEventListener('input',updateCuotaPreview);
}

function onTipoChange(val){
  const w=document.getElementById('m-benef-wrap');
  if(w){w.style.opacity=val==='compartido'?'0.4':'1';w.style.pointerEvents=val==='compartido'?'none':'auto';}
}
function onFrecChange(val){
  const w=document.getElementById('m-cuotas-wrap');
  if(w) w.style.display=val==='cuotas'?'':'none';
  updateCuotaPreview();
}
function updateCuotaPreview(){
  const wrap=document.getElementById('m-cuotas-wrap');
  if(!wrap||wrap.style.display==='none') return;
  const monto=parseFloat(document.getElementById('m-monto')?.value)||0;
  const cuotas=parseInt(document.getElementById('m-cuotas')?.value)||1;
  const prev=document.getElementById('m-cuota-preview');
  if(prev&&monto>0) prev.textContent=`→ ${fmt(monto/cuotas)} por cuota`;
}

async function guardarGasto(){
  const desc=(document.getElementById('m-desc')?.value||'').trim();
  const monto=parseFloat(document.getElementById('m-monto')?.value);
  const fecha=document.getElementById('m-fecha')?.value||hoy();
  const cat=document.getElementById('m-cat')?.value||'otro';
  const pagador=document.getElementById('m-pagador')?.value||'Flucy';
  const tipo=document.getElementById('m-tipo')?.value||'compartido';
  const beneficiario=tipo==='compartido'?null:document.getElementById('m-beneficiario')?.value;
  const frecuencia=document.getElementById('m-frec')?.value||'unica';
  const cuotas=frecuencia==='cuotas'?parseInt(document.getElementById('m-cuotas')?.value)||12:null;
  const notas=(document.getElementById('m-notas')?.value||'').trim();
  if(!desc||isNaN(monto)||monto<=0){alert('Completá descripción y monto.');return;}
  if(state.editando){
    const idx=state.gastos.findIndex(g=>g.id===state.modal.id);
    if(idx>-1) state.gastos[idx]={...state.gastos[idx],desc,monto,fecha,cat,pagador,tipo,beneficiario,frecuencia,cuotas,notas};
  } else {
    state.gastos.push({id:state.nextId++,desc,monto,fecha,cat,pagador,tipo,beneficiario,frecuencia,cuotas,notas});
  }
  state.modal=null;state.editando=false;
  render();
  await saveData();
}

async function borrar(id){
  if(!confirm('¿Borrar este gasto?')) return;
  state.gastos=state.gastos.filter(g=>g.id!==id);
  render();
  await saveData();
}

initTheme();
loadData();
</script>
</body>
</html>
